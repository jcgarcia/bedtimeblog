# PostgreSQL Deployment for EKS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-postgres
  namespace: blog
  labels:
    app: blog-postgres
    component: database
    environment: production
spec:
  replicas: 1
  strategy:
    type: Recreate  # Important for stateful apps with persistent storage
  selector:
    matchLabels:
      app: blog-postgres
  template:
    metadata:
      labels:
        app: blog-postgres
        component: database
    spec:
      serviceAccountName: blog-service-account
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "blog"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init-scripts
      # Node selector for appropriate instance types
      nodeSelector:
        kubernetes.io/arch: amd64  # Can be changed to arm64 if using Graviton instances
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 300
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: blog-postgres-service
  namespace: blog
  labels:
    app: blog-postgres
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: blog-postgres
---
# PostgreSQL Headless Service (for StatefulSet if needed later)
apiVersion: v1
kind: Service
metadata:
  name: blog-postgres-headless
  namespace: blog
  labels:
    app: blog-postgres
    component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: blog-postgres