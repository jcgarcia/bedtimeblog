# Persistent Volume Claims for EKS
# PostgreSQL Data Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: blog
  labels:
    app: blog-postgres
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3  # AWS EBS GP3 storage class
  resources:
    requests:
      storage: 20Gi
---
# CoreDB Storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coredb-pvc
  namespace: blog
  labels:
    app: blog-backend
    component: coredb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3  # AWS EBS GP3 storage class
  resources:
    requests:
      storage: 5Gi
---
