# Secrets for EKS deployment
# PostgreSQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: blog
  labels:
    app: blog-postgres
    component: database
type: Opaque
stringData:
  username: "blogadmin"
  password: "REPLACE_WITH_SECURE_PASSWORD"
  database-url: "postgresql://blogadmin:REPLACE_WITH_SECURE_PASSWORD@blog-postgres-service:5432/blog"
---
# Application secrets
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: blog
  labels:
    app: bedtime-blog
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_JWT_SECRET"
---
